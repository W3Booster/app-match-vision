<div *ngIf="showMatchBar()" class="obs-matchbar-4v4-wrapper">
    <ng-template #resourcesTemplate let-player="player">
        <div *ngIf="getPlayerResources(player) as resources" class="player-resources" [class.player-resources-full]="showFullResources()">
            <div class="resource resource-gold">{{ resources.gold | number:'1.0-0' }}</div>
            <div class="resource resource-lumber" *ngIf="showFullResources()">{{ resources.lumber | number:'1.0-0' }}</div>
            <div class="resource resource-food"
                [class.no-upkeep-color]="upkeepState(resources.supply) === 'none'"
                [class.low-upkeep-color]="upkeepState(resources.supply) === 'low'"
                [class.high-upkeep-color]="upkeepState(resources.supply) === 'high'">
                {{ resources.supply | number:'1.0-0' }} / {{ resources.supplyCap | number:'1.0-0' }}
            </div>
        </div>
    </ng-template>

    <div class="match-box match-box-team team-left {{additionalCss()}}">
        <div class="match-box-content">
            <div class="teams">
                <div *ngIf="teams()[0]" class="team">
                    <div *ngFor="let player of teams()[0]; let playerIndex = index; trackBy: trackPlayer"
                        class="player player-{{playerIndex}} {{playerIdentity(player).hasAlias ? 'player-has-alias' : 'player-has-no-alias'}}"
                        [style.color]="getColorCode(player)">
                        <div [class]="'player-color ' + (runtime.teamColors ? 'team-colors' : '')"
                            [style.color]="getColorCode(player)">
                            <div class="player-color-2"></div>
                        </div>
                            <div class="player-race" attr.data-race="{{getRaceName(player).toLowerCase()}}"
                            [style.borderColor]="getColorCode(player)"></div>
                        <div class="player-details">
                            <div class="player-name" [style.borderColor]="getColorCode(player)">
                                {{playerIdentity(player).primaryName}}
                            </div>
                            <div class="player-country"
                                *ngIf="player.displayCountry && player.displayCountry != 'tw'"
                                [style.backgroundImage]="countryFlagBackground(player.displayCountry)">
                            </div>
                        </div>
                        <ng-template [ngTemplateOutlet]="resourcesTemplate"
                            [ngTemplateOutletContext]="{ player: player }"></ng-template>
                        <div class="player-heroes" *ngIf="getPlayerHeroes(player).length > 0">
                            <div class="hero-chip" *ngFor="let hero of getPlayerHeroes(player); trackBy: trackHero">
                                <div class="hero-chip-icon"
                                    [class.grayscaled-filter]="hero.hitpoints && hero.hitpoints.current <= 0"
                                    [style.backgroundImage]="getHeroIconBackground(hero)">
                                    <div class="hero-chip-level">{{getHeroLevel(hero)}}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="match-box match-box-team team-right {{additionalCss()}}">
        <div class="match-box-content">
            <div class="teams">
                <div *ngIf="teams()[1]" class="team team-reversed">
                    <div *ngFor="let player of teams()[1]; let playerIndex = index; trackBy: trackPlayer"
                        class="player player-{{playerIndex}} {{playerIdentity(player).hasAlias ? 'player-has-alias' : 'player-has-no-alias'}}"
                        [style.color]="getColorCode(player)">
                        <div [class]="'player-color ' + (runtime.teamColors ? 'team-colors' : '')"
                            [style.color]="getColorCode(player)">
                            <div class="player-color-2"></div>
                        </div>
                            <div class="player-race" attr.data-race="{{getRaceName(player).toLowerCase()}}"
                            [style.borderColor]="getColorCode(player)"></div>
                        <div class="player-details">
                            <div class="player-name" [style.borderColor]="getColorCode(player)">
                                {{playerIdentity(player).primaryName}}
                            </div>
                            <div class="player-country"
                                *ngIf="player.displayCountry && player.displayCountry != 'tw'"
                                [style.backgroundImage]="countryFlagBackground(player.displayCountry)">
                            </div>
                        </div>
                        <ng-template [ngTemplateOutlet]="resourcesTemplate"
                            [ngTemplateOutletContext]="{ player: player }"></ng-template>
                        <div class="player-heroes" *ngIf="getPlayerHeroes(player).length > 0">
                            <div class="hero-chip" *ngFor="let hero of getPlayerHeroes(player); trackBy: trackHero">
                                <div class="hero-chip-icon"
                                    [class.grayscaled-filter]="hero.hitpoints && hero.hitpoints.current <= 0"
                                    [style.backgroundImage]="getHeroIconBackground(hero)">
                                    <div class="hero-chip-level">{{getHeroLevel(hero)}}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
