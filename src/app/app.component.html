<div class="connection-error" role="alert" *ngIf="surface !== 'overlay' && connection.error()">{{connection.error()}}</div>
<div class="connection-state" role="status" *ngIf="surface !== 'overlay' && !connection.state() && !connection.error()">
    <i aria-hidden="true"></i><span>{{connectionStatusMessage}}</span>
</div>

<ng-container *ngIf="connection.state() as state">
    @defer (when surface === 'overlay') {
        <mv-overlay-surface [state]="state" [settings]="connection.settings()"></mv-overlay-surface>
    }
    @defer (when surface === 'dashboard') {
        <mv-dashboard-surface
            *ngIf="connection.client() as client"
            [client]="client"
            [host]="connection.host()"
            [state]="state"
            [settings]="connection.settings()"
            [synchronized]="connection.synchronized()">
        </mv-dashboard-surface>
    }
    @defer (when surface === 'compact') {
        <mv-compact-dashboard-surface
            *ngIf="connection.client() as client"
            [client]="client"
            [host]="connection.host()"
            [state]="state"
            [settings]="connection.settings()"
            [status]="connection.status()"
            [synchronized]="connection.synchronized()">
        </mv-compact-dashboard-surface>
    }
</ng-container>
