name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Published registry SDK release gate
    runs-on: ubuntu-latest
    env:
      W3BOOSTER_SETTINGS_URL: ${{ secrets.W3BOOSTER_SETTINGS_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require the coordinated SDK 3 registry upgrade
        run: node scripts/check-release-sdk.mjs
      - run: npm ci
      - run: npm run check
      - name: Check database settings revision
        if: ${{ env.W3BOOSTER_SETTINGS_URL != '' }}
        run: npm run w3booster:check
  sdk-head:
    name: Packed SDK HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: app
      - uses: actions/checkout@v6
        with:
          repository: W3Booster/sdk
          # SDK 3 review dependency; restore default HEAD after the coordinated release.
          ref: e296db9edd480653f5382605120a4eb7d1b90010
          path: sdk
      - uses: actions/setup-node@v6
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: mkdir -p ../app/.sdk-pack && npm pack --pack-destination ../app/.sdk-pack
        working-directory: sdk
      # Resolve a disposable CI lockfile first. npm's no-save/lock-disabled
      # replacement crashes in Arborist before it can test SDK compatibility.
      # The published-registry lane and committed release lockfile stay intact.
      - run: npm install --save-exact --package-lock-only ./.sdk-pack/*.tgz
        working-directory: app
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Check overlay in Chromium
        working-directory: app
        run: |
          npm start -- --host 127.0.0.1 > /tmp/match-vision-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8082/ > /dev/null; then break; fi
            sleep 1
          done
          MV_TEST_URL=http://127.0.0.1:8082 npm run test:overlay:browser
