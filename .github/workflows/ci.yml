name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      W3BOOSTER_SETTINGS_URL: ${{ secrets.W3BOOSTER_SETTINGS_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check database settings revision
        if: ${{ env.W3BOOSTER_SETTINGS_URL != '' }}
        run: npm run w3booster:check
