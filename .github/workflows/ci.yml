name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Published registry SDK release gate
    runs-on: ubuntu-latest
    env:
      W3BOOSTER_SETTINGS_URL: ${{ secrets.W3BOOSTER_SETTINGS_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require the coordinated SDK 4 registry upgrade
        run: node scripts/check-release-sdk.mjs
      - run: npm ci
      - run: npm run check
      - run: npx playwright install-deps chromium
      - run: npm run test:release:ui
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: release-ui
          path: tmp/release-ui/
      - name: Check database settings revision
        if: ${{ env.W3BOOSTER_SETTINGS_URL != '' }}
        run: npm run w3booster:check
  sdk-head:
    name: Packed SDK HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: app
      - uses: actions/checkout@v6
        with:
          repository: W3Booster/sdk
          # Deliberately test the SDK development head; registry publication is a separate gate.
          ref: main
          path: sdk
      - uses: actions/setup-node@v6
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: mkdir -p ../app/.sdk-pack && npm pack --pack-destination ../app/.sdk-pack
        working-directory: sdk
      # Resolve a disposable CI lockfile first. npm's no-save/lock-disabled
      # replacement crashes in Arborist before it can test SDK compatibility.
      # The published-registry lane and committed release lockfile stay intact.
      - run: npm install --save-exact --package-lock-only ./.sdk-pack/*.tgz
        working-directory: app
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npx playwright install-deps chromium
        working-directory: app
      - name: Check the complete UI in Electron
        working-directory: app
        run: npm run test:release:ui
